name: OCI ARM Instance Retry

on:
  schedule:
    # Cada 10 minutos. GitHub advierte de posibles retrasos bajo carga.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: oci-arm-instance-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install OCI CLI
        run: pip install oci-cli --quiet

      - name: Add OCI CLI to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure OCI CLI
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.oci
          # tr -d '\r' elimina posibles retornos de carro (CRLF) si el secreto se copió desde Windows
          printf '%s\n' "$OCI_PRIVATE_KEY" | tr -d '\r' > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=/home/runner/.oci/oci_api_key.pem
          EOF
          chmod 600 ~/.oci/config

      - name: Verify OCI CLI configuration
        run: |
          echo "Verificando autenticación con OCI..."
          oci iam region list --output table

      - name: Check if instance already exists
        id: check
        run: |
          RESULT=$(oci compute instance list \
            --compartment-id "${{ secrets.OCI_COMPARTMENT_OCID }}" \
            --display-name "n8n-arm-instance" \
            --query 'data[?"lifecycle-state"!=`TERMINATED`].id' \
            --all)
      
          echo "Resultado de búsqueda: [$RESULT]"
      
          if [[ -z "$RESULT" || "$RESULT" == "[]" ]]; then
            echo "No existe ninguna instancia 'n8n-arm-instance'."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Existe al menos una instancia 'n8n-arm-instance'."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instance already exists
        if: steps.check.outputs.count != '0'
        run: |
          echo "Instance 'n8n-arm-instance' already exists. Nothing to do."

      - name: Create SSH key file
        if: steps.check.outputs.count == '0'
        env:
          SSH_PUBLIC_KEY: ${{ secrets.INSTANCE_SSH_PUBLIC_KEY }}
        run: |
          printf '%s\n' "$SSH_PUBLIC_KEY" | tr -d '\r' > /tmp/authorized_keys
          chmod 600 /tmp/authorized_keys

      - name: Attempt to create instance
        id: create
        if: steps.check.outputs.count == '0'
        run: |
          echo "Intentando crear la instancia ARM..."
          oci compute instance launch \
            --compartment-id "${{ secrets.OCI_COMPARTMENT_OCID }}" \
            --availability-domain "${{ secrets.OCI_AVAILABILITY_DOMAIN }}" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":2,"memoryInGBs":12}' \
            --image-id "${{ secrets.OCI_IMAGE_ID }}" \
            --subnet-id "${{ secrets.OCI_SUBNET_ID }}" \
            --display-name "n8n-arm-instance" \
            --assign-public-ip true \
            --ssh-authorized-keys-file "/tmp/authorized_keys" \
            --boot-volume-size-in-gbs 100 \
            --wait-for-state RUNNING \
            --max-wait-seconds 600

      - name: Creation failed
        if: steps.create.outcome == 'failure'
        run: |
          echo "Instance creation failed."
          echo "The next scheduled run will retry."
          echo ""
          echo "Errores comunes:"
          echo "  Out of host capacity    → Comportamiento esperado."
          echo "  NotAuthorizedOrNotFound → Revisa políticas IAM o los OCIDs."
          echo "  InvalidParameter        → Revisa OCI_IMAGE_ID, OCI_SUBNET_ID o shape."
