name: OCI ARM Instance Retry

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: oci-arm-instance-retry
  cancel-in-progress: true

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install OCI CLI
        run: pip install oci-cli --quiet

      - name: Add OCI CLI to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure OCI CLI
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_PRIVATE_KEY" | tr -d '\r' > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=/home/runner/.oci/oci_api_key.pem
          EOF
          chmod 600 ~/.oci/config

      - name: Verify OCI CLI configuration
        run: |
          echo "Verificando autenticación con OCI..."
          oci iam region list --output table > /dev/null
          echo "✅ Autenticación correcta."

      - name: Check if instance already exists
        id: check
        run: |
          RESULT=$(oci compute instance list \
            --compartment-id "${{ secrets.OCI_COMPARTMENT_OCID }}" \
            --display-name "n8n-arm-instance" \
            --query 'data[?"lifecycle-state"!=`TERMINATED`].id' \
            --all)

          echo "Resultado de búsqueda: [$RESULT]"

          if [[ -z "$RESULT" || "$RESULT" == "[]" ]]; then
            echo "No existe ninguna instancia 'n8n-arm-instance'."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Existe al menos una instancia 'n8n-arm-instance'."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instance already exists
        if: steps.check.outputs.exists == 'true'
        run: |
          echo "✅ La instancia 'n8n-arm-instance' ya existe. Nada que hacer."

      - name: Create SSH key file
        if: steps.check.outputs.exists == 'false'
        env:
          SSH_PUBLIC_KEY: ${{ secrets.INSTANCE_SSH_PUBLIC_KEY }}
        run: |
          printf '%s\n' "$SSH_PUBLIC_KEY" | tr -d '\r' > /tmp/authorized_keys
          chmod 600 /tmp/authorized_keys

      - name: Attempt to create instance
        id: create
        if: steps.check.outputs.exists == 'false'
        continue-on-error: true
        run: |
          echo "Intentando crear la instancia ARM..."
          set +e
          OUTPUT=$(oci compute instance launch \
            --compartment-id "${{ secrets.OCI_COMPARTMENT_OCID }}" \
            --availability-domain "${{ secrets.OCI_AVAILABILITY_DOMAIN }}" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":2,"memoryInGBs":12}' \
            --image-id "${{ secrets.OCI_IMAGE_ID }}" \
            --subnet-id "${{ secrets.OCI_SUBNET_ID }}" \
            --display-name "n8n-arm-instance" \
            --assign-public-ip true \
            --ssh-authorized-keys-file "/tmp/authorized_keys" \
            --boot-volume-size-in-gbs 100 \
            --wait-for-state RUNNING \
            --max-wait-seconds 600 2>&1)
          EXIT_CODE=$?

          echo "$OUTPUT"

          # Errores esperados: no son fallos reales
          if echo "$OUTPUT" | grep -q '"code": *"InternalError"' \
             && echo "$OUTPUT" | grep -q "Out of host capacity"; then
            echo "⏳ Sin capacidad ARM disponible. Reintentaremos en el próximo ciclo."
            echo "resultado=sin_capacidad" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "$OUTPUT" | grep -q '"code": *"TooManyRequests"'; then
            echo "⏳ Rate limit de OCI. Reintentaremos en el próximo ciclo."
            echo "resultado=rate_limit" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Cualquier otro error sí es un fallo real
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Error inesperado al crear la instancia."
            echo "resultado=error_real" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "✅ Instancia creada correctamente."
          echo "resultado=creada" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          echo "### Resultado del intento" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check.outputs.exists }}" == "true" ]; then
            echo "✅ La instancia ya existía. Nada que hacer." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.create.outputs.resultado }}" == "creada" ]; then
            echo "🎉 Instancia ARM creada correctamente." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.create.outputs.resultado }}" == "sin_capacidad" ]; then
            echo "⏳ Sin capacidad ARM en OCI. Se reintentará en el próximo ciclo." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.create.outputs.resultado }}" == "rate_limit" ]; then
            echo "⏳ Rate limit de OCI. Se reintentará en el próximo ciclo." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Error inesperado. Revisar el log." >> $GITHUB_STEP_SUMMARY
          fi
